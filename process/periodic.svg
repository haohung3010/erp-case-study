<circle cx="675" cy="440" r="18" fill="#FFFFFF" stroke="#1D5C6B" stroke-width="3.5"/>
<text x="675" y="470" text-anchor="middle" fill="#16232B" font-size="10">Nothing overdue</text>
<circle cx="975" cy="200" r="18" fill="#FFFFFF" stroke="#1D5C6B" stroke-width="1.5"/>
<text x="975" y="230" text-anchor="middle" fill="#16232B" font-size="10">Month end</text>
<rect x="1065" y="170" width="120" height="60" rx="3" fill="#DCEBEE" stroke="#1D5C6B" stroke-width="1.2"/>
<text x="1125" y="204" text-anchor="middle" fill="#16232B">Count stock</text>
<text x="1069" y="181" fill="#5B6B73" font-size="9">T3</text>
<rect x="1215" y="410" width="120" height="60" rx="3" fill="#DCEBEE" stroke="#906915" stroke-width="2.2"/>
<text x="1275" y="431" text-anchor="middle" fill="#16232B">Reconcile the</text>
<text x="1275" y="444" text-anchor="middle" fill="#16232B">count with the</text>
<text x="1275" y="457" text-anchor="middle" fill="#16232B">books</text>
<text x="1219" y="421" fill="#5B6B73" font-size="9">T4</text>
<polygon points="1425,415 1450,440 1425,465 1400,440" fill="#F5E9CC" stroke="#906915" stroke-width="2.2"/>
<text x="1417" y="411" text-anchor="end" fill="#16232B" font-size="10">Any difference?</text>
<circle cx="1575" cy="440" r="18" fill="#FFFFFF" stroke="#1D5C6B" stroke-width="3.5"/>
<text x="1575" y="470" text-anchor="middle" fill="#16232B" font-size="10">Reconciled</text>
<rect x="1515" y="170" width="120" height="60" rx="3" fill="#DCEBEE" stroke="#906915" stroke-width="2.2"/>
<text x="1575" y="184" text-anchor="middle" fill="#16232B">Find the step that</text>
<text x="1575" y="197" text-anchor="middle" fill="#16232B">skipped the</text>
<text x="1575" y="210" text-anchor="middle" fill="#16232B">system; sign off</text>
<text x="1575" y="223" text-anchor="middle" fill="#16232B">the difference</text>
<text x="1519" y="181" fill="#5B6B73" font-size="9">T5</text>
<circle cx="1725" cy="200" r="18" fill="#FFFFFF" stroke="#1D5C6B" stroke-width="3.5"/>
<text x="1725" y="230" text-anchor="middle" fill="#16232B" font-size="10">Signed off</text>
<circle cx="1875" cy="440" r="18" fill="#FFFFFF" stroke="#1D5C6B" stroke-width="1.5"/>
<text x="1875" y="470" text-anchor="middle" fill="#16232B" font-size="10">Quarter end</text>
<rect x="1965" y="410" width="120" height="60" rx="3" fill="#DCEBEE" stroke="#906915" stroke-width="2.2"/>
<text x="2025" y="431" text-anchor="middle" fill="#16232B">Send each customer</text>
<text x="2025" y="444" text-anchor="middle" fill="#16232B">its statement of</text>
<text x="2025" y="457" text-anchor="middle" fill="#16232B">open invoices</text>
<text x="1969" y="421" fill="#5B6B73" font-size="9">T6</text>
