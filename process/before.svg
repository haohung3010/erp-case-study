<circle cx="225" cy="80" r="18" fill="#FFFFFF" stroke="#1D5C6B" stroke-width="1.5"/>
<text x="225" y="110" text-anchor="middle" fill="#16232B" font-size="10">Customer phones</text>
<text x="225" y="121" text-anchor="middle" fill="#16232B" font-size="10">or emails</text>
<rect x="315" y="50" width="120" height="60" rx="3" fill="#DCEBEE" stroke="#1D5C6B" stroke-width="1.2"/>
<text x="375" y="77" text-anchor="middle" fill="#16232B">Write a paper</text>
<text x="375" y="90" text-anchor="middle" fill="#16232B">order form</text>
<text x="319" y="61" fill="#5B6B73" font-size="9">T1</text>
<rect x="465" y="170" width="120" height="60" rx="3" fill="#DCEBEE" stroke="#1D5C6B" stroke-width="1.2"/>
<text x="525" y="197" text-anchor="middle" fill="#16232B">Walk the shelves</text>
<text x="525" y="210" text-anchor="middle" fill="#16232B">to check stock</text>
<text x="469" y="181" fill="#5B6B73" font-size="9">T2</text>
<polygon points="675,175 700,200 675,225 650,200" fill="#F5E9CC" stroke="#906915" stroke-width="1.2"/>
<text x="667" y="171" text-anchor="end" fill="#16232B" font-size="10">In stock?</text>
<rect x="765" y="290" width="120" height="60" rx="3" fill="#DCEBEE" stroke="#1D5C6B" stroke-width="1.2"/>
<text x="825" y="311" text-anchor="middle" fill="#16232B">Email supplier;</text>
<text x="825" y="324" text-anchor="middle" fill="#16232B">note it in a</text>
<text x="825" y="337" text-anchor="middle" fill="#16232B">spreadsheet</text>
<text x="769" y="301" fill="#5B6B73" font-size="9">T3</text>
<rect x="915" y="410" width="120" height="60" rx="3" fill="#DCEBEE" stroke="#1D5C6B" stroke-width="1.2"/>
<text x="975" y="437" text-anchor="middle" fill="#16232B">Receive materials;</text>
<text x="975" y="450" text-anchor="middle" fill="#16232B">tick paper note</text>
<text x="919" y="421" fill="#5B6B73" font-size="9">T4</text>
<rect x="1065" y="530" width="120" height="60" rx="3" fill="#DCEBEE" stroke="#1D5C6B" stroke-width="1.2"/>
<text x="1125" y="557" text-anchor="middle" fill="#16232B">Build from a paper</text>
<text x="1125" y="570" text-anchor="middle" fill="#16232B">job card</text>
<text x="1069" y="541" fill="#5B6B73" font-size="9">T5</text>
<rect x="1215" y="410" width="120" height="60" rx="3" fill="#DCEBEE" stroke="#1D5C6B" stroke-width="1.2"/>
<text x="1275" y="437" text-anchor="middle" fill="#16232B">Ship with a paper</text>
<text x="1275" y="450" text-anchor="middle" fill="#16232B">delivery note</text>
<text x="1219" y="421" fill="#5B6B73" font-size="9">T6</text>
<rect x="1365" y="650" width="120" height="60" rx="3" fill="#DCEBEE" stroke="#1D5C6B" stroke-width="1.2"/>
<text x="1425" y="671" text-anchor="middle" fill="#16232B">Key the invoice</text>
<text x="1425" y="684" text-anchor="middle" fill="#16232B">into the</text>
<text x="1425" y="697" text-anchor="middle" fill="#16232B">accounting tool</text>
<text x="1369" y="661" fill="#5B6B73" font-size="9">T7</text>
<rect x="1515" y="650" width="120" height="60" rx="3" fill="#DCEBEE" stroke="#1D5C6B" stroke-width="1.2"/>
<text x="1575" y="677" text-anchor="middle" fill="#16232B">Match payment to</text>
<text x="1575" y="690" text-anchor="middle" fill="#16232B">invoice by hand</text>
<text x="1519" y="661" fill="#5B6B73" font-size="9">T8</text>
<rect x="1665" y="650" width="120" height="60" rx="3" fill="#DCEBEE" stroke="#1D5C6B" stroke-width="1.2"/>
<text x="1725" y="664" text-anchor="middle" fill="#16232B">Find overdue</text>
<text x="1725" y="677" text-anchor="middle" fill="#16232B">customers at the</text>
<text x="1725" y="690" text-anchor="middle" fill="#16232B">quarter-end</text>
<text x="1725" y="703" text-anchor="middle" fill="#16232B">statement</text>
<text x="1669" y="661" fill="#5B6B73" font-size="9">T9</text>
<circle cx="1875" cy="680" r="18" fill="#FFFFFF" stroke="#1D5C6B" stroke-width="3.5"/>
<text x="1875" y="710" text-anchor="middle" fill="#16232B" font-size="10">Paid</text>
<text x="12" y="788" fill="#5B6B73" font-size="10">Order to cash, before (paper, email and spreadsheets). Tanmark Industries is fictional.</text>
