<rect x="315" y="410" width="120" height="60" rx="3" fill="#DCEBEE" stroke="#906915" stroke-width="2.2"/>
<text x="375" y="431" text-anchor="middle" fill="#16232B">Run the ageing</text>
<text x="375" y="444" text-anchor="middle" fill="#16232B">view of open</text>
<text x="375" y="457" text-anchor="middle" fill="#16232B">invoices</text>
<text x="319" y="421" fill="#5B6B73" font-size="9">T1</text>
