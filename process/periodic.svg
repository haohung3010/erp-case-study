<text x="2175" y="77" text-anchor="middle" fill="#16232B">Customer signs, or</text>
<text x="2175" y="90" text-anchor="middle" fill="#16232B">disputes a line</text>
<text x="2119" y="61" fill="#5B6B73" font-size="9">T7</text>
<polygon points="2325,55 2350,80 2325,105 2300,80" fill="#F5E9CC" stroke="#906915" stroke-width="1.2"/>
<text x="2317" y="51" text-anchor="end" fill="#16232B" font-size="10">Signed?</text>
<circle cx="2475" cy="80" r="18" fill="#FFFFFF" stroke="#1D5C6B" stroke-width="3.5"/>
<text x="2475" y="110" text-anchor="middle" fill="#16232B" font-size="10">Reconciled</text>
<rect x="2415" y="410" width="120" height="60" rx="3" fill="#DCEBEE" stroke="#906915" stroke-width="2.2"/>
<text x="2475" y="431" text-anchor="middle" fill="#16232B">Resolve the</text>
<text x="2475" y="444" text-anchor="middle" fill="#16232B">dispute; credit</text>
<text x="2475" y="457" text-anchor="middle" fill="#16232B">note if owed</text>
<text x="2419" y="421" fill="#5B6B73" font-size="9">T8</text>
<circle cx="2625" cy="440" r="18" fill="#FFFFFF" stroke="#1D5C6B" stroke-width="3.5"/>
<text x="2625" y="470" text-anchor="middle" fill="#16232B" font-size="10">Resolved</text>
<circle cx="2775" cy="320" r="18" fill="#FFFFFF" stroke="#1D5C6B" stroke-width="1.5"/>
<text x="2775" y="350" text-anchor="middle" fill="#16232B" font-size="10">Supplier sends a</text>
<text x="2775" y="361" text-anchor="middle" fill="#16232B" font-size="10">new price list</text>
<rect x="2865" y="290" width="120" height="60" rx="3" fill="#DCEBEE" stroke="#906915" stroke-width="2.2"/>
<text x="2925" y="311" text-anchor="middle" fill="#16232B">Load it one week</text>
<text x="2925" y="324" text-anchor="middle" fill="#16232B">before it takes</text>
<text x="2925" y="337" text-anchor="middle" fill="#16232B">effect</text>
<text x="2869" y="301" fill="#5B6B73" font-size="9">T9</text>
<circle cx="3075" cy="320" r="18" fill="#FFFFFF" stroke="#1D5C6B" stroke-width="3.5"/>
<text x="3075" y="350" text-anchor="middle" fill="#16232B" font-size="10">Loaded on time</text>
<text x="12" y="548" fill="#5B6B73" font-size="10">Periodic routines, after: ageing, reconciliations and price lists. Tanmark Industries is fictional. Bold ochre outline: a step added or changed by the new system.</text>
