<text x="517" y="400" text-anchor="end" fill="#16232B" font-size="10">Overdue or over the</text>
<text x="517" y="411" text-anchor="end" fill="#16232B" font-size="10">limit?</text>
<rect x="615" y="50" width="120" height="60" rx="3" fill="#DCEBEE" stroke="#906915" stroke-width="2.2"/>
<text x="675" y="71" text-anchor="middle" fill="#16232B">Contract on credit</text>
<text x="675" y="84" text-anchor="middle" fill="#16232B">hold; sales chases</text>
<text x="675" y="97" text-anchor="middle" fill="#16232B">the customer</text>
<text x="619" y="61" fill="#5B6B73" font-size="9">T2</text>
<circle cx="825" cy="80" r="18" fill="#FFFFFF" stroke="#1D5C6B" stroke-width="3.5"/>
